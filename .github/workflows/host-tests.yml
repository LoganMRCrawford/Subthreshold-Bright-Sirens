name: Host tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source only
        uses: actions/checkout@v4
      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements-host.txt
      - name: Install host dependencies only
        run: python -m pip install -r pipeline/requirements-host.txt
      - name: Run offline safety and interface tests
        run: python -m unittest discover -s pipeline/tests -v
      - name: Check source-only archive status
        run: python archive/layout.py status
      - name: Check host command entrypoint
        run: python pipeline/run.py doctor